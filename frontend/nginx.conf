server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index pages/index.html index.html;

    # File statis dan routing halaman HTML
    location / {
        try_files $uri $uri/ /pages$uri /pages$uri.html /pages/index.html;
    }

    # Proxy API ke backend Express container
    location /api/ {
        proxy_pass http://backend_filmolic_container:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}